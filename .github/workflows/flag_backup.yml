name: 风向标备份线（主线失联时接管）

# ============================================================
# ⚠️ 降频（2026-11-25）：原 '7,17,27,37,47,57 * * * *'（每 10 分钟，6 次/小时）
#    现在改为每 2 小时 1 次。
#
# 理由：这条线的唯一职责是「主线挂了顶上」，而主线本身现在每小时 1 次。
# 检查频率只需要「比主线慢但不至于长时间不知道」即可，
# 每 2 小时一次完全够用，却把账户触发量降了 90%+。
#
# 与主线、与熬鹰交易监控（poll.yml / watch.yml）保持独立：
#   - 独立 cron（:53 分），不与主线 :23 撞车
#   - 独立 concurrency group（flag-backup），不与任何工作流排队互锁
#   - 不写 main 分支（状态走 flag-state 分支），不会挤掉 poll.yml 的 git push
#   - 主线正常时只查一次 Actions 接口就退出，不抓数据、不推送
# ============================================================

on:
  schedule:
    - cron: '53 */2 * * *'
  workflow_dispatch:

concurrency:
  group: flag-backup
  cancel-in-progress: false

permissions:
  contents: write     # 接管时需要回写 flag-state 分支
  actions: read       # 需要查 flag.yml 的运行记录判断主线死活

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 检查主线并（必要时）接管
        env:
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          FLAG_ROLE: backup
        run: python flag_watchdog.py
