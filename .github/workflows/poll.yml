name: Poll Ayao
on:
  schedule:
    # GitHub 免费版 cron 会被推迟/合并，实测 */5 实际约每小时触发一次。
    # 用两个错开的 cron 提高触发概率（GitHub 会尽力调度）。
    - cron: '*/10 * * * *'
    - cron: '5,15,25,35,45,55 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ayao-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Poll once
        env:
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          AYAO_TIMEOUT: '15'
        run: timeout 120 python poll.py || echo "poll exited non-zero, continue"
      - name: Smart money consensus
        run: timeout 200 python poll_market.py || echo "market poll failed, continue"
      - name: Probe trade API
        run: timeout 90 python probe_trade.py || echo "probe failed, continue"
      - name: Probe detail
        run: timeout 90 python probe4.py || echo "probe failed"
      - name: Commit snapshot
        run: |
          git config user.name "ayao-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snap.json config.json consensus.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "snapshot $(date -u +%FT%TZ)"
          git push
