name: Poll Ayao

# ============================================================
# ⚠️ 降频（2026-11-25）：原来挂了两条 cron 互相补位
#      '*/10 * * * *'  +  '5,15,25,35,45,55 * * * *'
#    两条叠加 = 每小时 12 次（实际约每 5 分钟一次）。
#
#    现在只保留一条，每小时 6 次。
#
#    为什么不砍更狠：这是交易监控，是核心需求，实时性要保住。
#    为什么砍得动：真正的实时推送在 watch.yml（tick 级），
#    poll.yml 只是定期全量扫描，10 分钟一次完全够。
# ============================================================

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ayao-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Poll once
        env:
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          AYAO_TIMEOUT: '15'
        run: timeout 120 python poll.py || echo "poll exited non-zero, continue"
      - name: Smart money consensus
        env:
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: timeout 200 python poll_market.py || echo "market poll failed, continue"
      - name: Probe trade API
        run: timeout 90 python probe_trade.py || echo "probe failed, continue"
      - name: Build macro data
        run: timeout 240 python gen_macro.py || echo "macro build failed, continue"
      - name: Commit snapshot
        run: |
          git config user.name "ayao-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snap.json config.json consensus.json macro.json fx.json holdings.json
          if [ -f market_state.json ]; then git add market_state.json; fi
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "snapshot $(date -u +%FT%TZ)"
          # ⚠️ probe.yml 也在往 main 推，撞上就是
          #    `! [rejected] main -> main (fetch first)`，之前直接失败过。
          #    rebase 后重试，最多 3 次。
          for i in 1 2 3; do
            if git push; then echo "push ok"; exit 0; fi
            echo "push 被拒（第 $i 次），rebase 后重试"
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "::error::push 连续 3 次失败，本轮快照未提交（下一轮会重新生成）"
          exit 1
