name: Probe API

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run probe
        run: python probe_api2.py
      - name: Commit result
        run: |
          git config user.name "ayao-bot"
          git config user.email "actions@users.noreply.github.com"
          git add probe_out.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "probe $(date -u +%FT%TZ)"
          # ⚠️ poll.yml 也往 main 推，撞上就是
          #    `! [rejected] main -> main (fetch first)`。
          #    用 rebase -X ours：冲突时自动保留本轮新数据，不卡在 unmerged files。
          for i in 1 2 3; do
            if git push; then echo "push ok"; exit 0; fi
            echo "push 被拒（第 $i 次），rebase -X ours 后重试"
            git rebase --abort 2>/dev/null || true
            git pull --rebase -X ours origin main || true
            sleep 3
          done
          echo "::error::push 连续 3 次失败"
          exit 1
