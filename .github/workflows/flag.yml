name: 风向标监控（增减持 / 国家队 ETF）

on:
  schedule:
    # 每 20 分钟扫一次（UTC）。A 股公告集中在盘后 15:00-20:00，其余时段零星
    - cron: '*/20 * * * *'
  workflow_dispatch:

# 防止并发写状态文件冲突
concurrency:
  group: flag-poll
  cancel-in-progress: false

permissions:
  contents: write     # 需要回写 flag_state.json 去重

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取并推送
        env:
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python flag_poll.py
