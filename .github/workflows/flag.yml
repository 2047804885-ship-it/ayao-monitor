name: 风向标监控（增减持 / 国家队 ETF）

# ============================================================
# ⚠️ 降频重要说明（2026-11-25）
#
# 原 cron 是 '2,12,22,32,42,52 * * * *'（每 10 分钟），
# 加上备份线同样 10 分钟一轮，风向标光自己就 12 次/小时。
# 配合 poll.yml 双 cron（12 次/小时）等，全仓每小时触发约 29 次 = 每天 700 次。
#
# 结果：2026-11-24 19:04 起账户被 GitHub 风控，
#       所有工作流 startup_failure、零 job，主备双线同时哑火。
#
# 现在的频率策略：
#   - 风向标的主线降到 **每小时 1 次**（数据源是日频公告，1 小时完全够）
#   - 备份线降到 2 小时 1 次，只查主线死活
#   - 真正的高频需求交给 Vercel 那条独立线（不占 GitHub 账户风控额度）
#
# 为什么是 :23 分：避开 :00/:30 整点高峰，GitHub 官方承认高峰期会延迟甚至跳过。
# ============================================================

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

# 防止并发写状态文件冲突
concurrency:
  group: flag-poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取并推送
        env:
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        # 脚本内部已按模块容错，这里再加一层：网络抖动导致的整体失败重试 1 次
        # （原来重试 3 次、每次间隔 30 秒，单次失败就烧掉 90 秒额度，对新账号不友好）
        run: |
          for i in 1 2; do
            python flag_poll.py && exit 0
            echo "第 $i 次运行失败，20 秒后重试"
            sleep 20
          done
          echo "两次均失败"
          exit 1
