name: Push One Coin

# 手动触发，只分析并推送指定币种，用于人工验证推送格式
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: '币种（如 UNI 或 UNI_USDT）'
        required: true
        default: 'UNI'

permissions:
  contents: read

jobs:
  push-one:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze and push
        env:
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: python tmp_push_one.py "${{ inputs.symbol }}"
