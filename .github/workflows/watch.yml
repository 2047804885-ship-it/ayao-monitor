name: Ayao Watch (realtime push)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'watch = 长驻轮询；test = 只发一条测试推送'
        required: false
        default: 'watch'
  schedule:
    # 兜底：万一长驻链路断了，每 30 分钟自动补一次
    - cron: '*/30 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: ayao-watch-${{ github.event.inputs.mode || 'watch' }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test push
        if: github.event.inputs.mode == 'test'
        env:
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: python watch.py --test-push

      - name: Watch loop
        if: github.event.inputs.mode != 'test'
        env:
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AYAO_POLL_SEC: '15'
          AYAO_MAX_HOURS: '5.6'
        run: |
          git config user.name "ayao-bot"
          git config user.email "actions@users.noreply.github.com"
          python watch.py

      - name: Show state
        if: always()
        run: |
          echo "--- watchlog ---"
          tail -20 watchlog.txt 2>/dev/null || echo "(no log)"
          echo "--- state ---"
          cat watchstate.json 2>/dev/null || echo "(no state)"

      # 保险层：正常结束时 python 已经触发下一棒；这里只在失败/被取消时补触发，
      # 避免「进程没跑到结尾就死了 → 链条断掉」
      - name: Chain next run on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, urllib.request
          tok = os.environ.get('GH_TOKEN', '')
          repo = os.environ.get('GITHUB_REPOSITORY', '')
          if not tok:
              print('no token, skip')
              raise SystemExit(0)
          url = 'https://api.github.com/repos/%s/actions/workflows/watch.yml/dispatches' % repo
          req = urllib.request.Request(
              url, data=b'{"ref":"main","inputs":{"mode":"watch"}}', method='POST',
              headers={'Authorization': 'Bearer ' + tok,
                       'Accept': 'application/vnd.github+json',
                       'Content-Type': 'application/json',
                       'User-Agent': 'ayao-chain'})
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  print('chained next run:', r.status)
          except Exception as e:
              print('chain failed:', e)
          PY
