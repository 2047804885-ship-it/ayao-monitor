name: Watchdog

# ============================================================
# 看门狗：每 30 分钟检查三条线的"活着"状态，发现断档就主动补拉。
#
# 历史：
#   2026-11-25  '*/20' → '*/30'（降频，减少账户触发量）
#   2026-11-27  扩展守护 poll（交易动态+信号雷达，原来只有 schedule+本机催更）
#   2026-11-27  扩展守护 flag（风向标主线实测会被 GitHub 跳过，04:29→06:21 空窗 111 分钟）
#
# 三个守护的判据：
#   watch  最近没有 in_progress/pending 的 watch run        → dispatch watch
#   poll   最近 40 分钟无 success 且无在跑/排队              → dispatch poll
#   flag   最近 90 分钟无 success 且无在跑/排队              → dispatch flag
# ============================================================

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: ayao-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure watch / poll / flag alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, time
          from datetime import datetime

          tok = os.environ.get('GH_TOKEN', '')
          repo = os.environ.get('GITHUB_REPOSITORY', '')
          H = {'Authorization': 'Bearer ' + tok,
               'Accept': 'application/vnd.github+json',
               'User-Agent': 'ayao-watchdog'}

          def get(path):
              req = urllib.request.Request('https://api.github.com/repos/%s/%s' % (repo, path), headers=H)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode())

          def dispatch(wf, body=None):
              data = json.dumps(body or {'ref': 'main'}).encode()
              req = urllib.request.Request(
                  'https://api.github.com/repos/%s/actions/workflows/%s/dispatches' % (repo, wf),
                  data=data, method='POST',
                  headers=dict(H, **{'Content-Type': 'application/json'}))
              with urllib.request.urlopen(req, timeout=20) as r:
                  print('  dispatched %s: HTTP %s' % (wf, r.status))

          def last_success_age_min(runs):
              now = time.time()
              last_ok = None
              for r in runs:
                  if r.get('conclusion') == 'success':
                      t = (r.get('updated_at') or r.get('created_at') or '').replace('Z', '+00:00')
                      try:
                          ts = datetime.fromisoformat(t).timestamp()
                      except Exception:
                          continue
                      if last_ok is None or ts > last_ok:
                          last_ok = ts
              return None if last_ok is None else (now - last_ok) / 60

          def has_active(runs):
              return [r for r in runs if r.get('status') in ('in_progress', 'queued', 'pending', 'waiting')]

          # ---------- 1) watch 守护 ----------
          runs = get('actions/runs?status=in_progress&per_page=50').get('workflow_runs', [])
          alive = [r for r in runs if r.get('name', '').startswith('Ayao Watch')]
          if alive:
              print('watcher alive:', alive[0]['id'])
          else:
              pend = get('actions/runs?status=pending&per_page=50').get('workflow_runs', [])
              queued = [r for r in pend if r.get('name', '').startswith('Ayao Watch')]
              if queued:
                  print('watcher queued, wait:', queued[0]['id'])
              else:
                  print('NO watcher -> dispatch watch')
                  dispatch('watch.yml', {'ref': 'main', 'inputs': {'mode': 'watch'}})

          # ---------- 2) poll 守护 ----------
          pruns = get('actions/workflows/poll.yml/runs?per_page=8').get('workflow_runs', [])
          if has_active(pruns):
              print('poll active:', has_active(pruns)[0]['status'])
          else:
              age = last_success_age_min(pruns)
              if age is None:
                  print('poll: no success -> dispatch')
                  dispatch('poll.yml')
              elif age > 40:
                  print('poll stale %.0f min -> dispatch' % age)
                  dispatch('poll.yml')
              else:
                  print('poll ok: %.0f min ago' % age)

          # ---------- 3) flag 守护 ----------
          fruns = get('actions/workflows/flag.yml/runs?per_page=8').get('workflow_runs', [])
          if has_active(fruns):
              print('flag active:', has_active(fruns)[0]['status'])
          else:
              age = last_success_age_min(fruns)
              if age is None:
                  print('flag: no success -> dispatch')
                  dispatch('flag.yml')
              elif age > 90:
                  print('flag stale %.0f min -> dispatch' % age)
                  dispatch('flag.yml')
              else:
                  print('flag ok: %.0f min ago' % age)
          PY
